<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 多模態助理 (最終佈局版)</title>
    <style>
        /* --- 1. 全局設定 --- */
        body { 
            font-family: '微軟正黑體', 'Segoe UI', sans-serif;
            margin: 0; padding: 0; 
            background-color: #f4f7f9; 
            height: 100vh; 
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
        }

        /* --- 主容器 --- */
        .main-container {
            width: 1250px;
            max-width: 98vw;
            height: 92vh;
            background-color: #fff;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.12); 
            display: grid;
            grid-template-columns: 380px 1fr; /* 左側略縮，右側加大 */
            gap: 30px;
            padding: 40px;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        /* --- 頂部連線列 --- */
        .connection-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            background: rgba(40, 44, 52, 0.95);
            padding: 10px;
            text-align: center;
            z-index: 1000;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            transform: translateY(-85%);
            transition: transform 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .connection-bar:hover { transform: translateY(0); }
        .connection-bar span { color: #fff; font-weight: bold; font-size: 0.9rem; }
        .connection-bar input { padding: 8px 15px; border-radius: 20px; border:none; width: 350px; outline: none; }
        .connection-bar button { cursor: pointer; background: #007bff; color: white; border: none; padding: 8px 20px; border-radius: 20px; font-weight: bold; }

        h3 {
            margin: 0 0 15px 0; font-size: 1.1em; color: #555; font-weight: 700;
            border-left: 5px solid #007bff; padding-left: 12px;
        }

        /* ================= 左側區域 ================= */
        .left-column {
            display: flex; flex-direction: column; gap: 20px; height: 100%;
        }

        /* 視訊區 */
        .video-container-wrapper { flex: 1.5; display: flex; flex-direction: column; }
        .video-box {
            flex: 1; background: #ffffff; border-radius: 16px; padding: 10px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.06); display: flex; flex-direction: column;
        }
        #camera-preview {
            width: 100%; height: 100%; background-color: #222; border-radius: 12px; overflow: hidden;
        }
        #camera-preview video { width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        #record-button {
            width: 100%; margin-top: 15px; padding: 15px; border-radius: 12px; border: none; font-weight: bold; font-size: 1.1em;
            cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .btn-idle { background-color: #fff; color: #007bff; border: 2px solid #eef2f7 !important; }
        .btn-recording { background-color: #ff4757; color: white; animation: pulse 1.5s infinite; }
        .btn-processing { background-color: #ffa502; color: white; }

        /* 文字區 (縮小) */
        .text-container-wrapper { flex: 1; display: flex; flex-direction: column; }
        .text-input-box {
            background: #fcfcfc; border-radius: 16px; padding: 20px; flex: 1; display: flex; flex-direction: column;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.02); border: 1px solid #f0f0f0;
        }
        #user-text-mirror {
            flex: 1; background: transparent; font-size: 1em; color: #666; overflow-y: auto; margin-bottom: 10px; font-style: italic;
        }
        .visualizer-container { height: 40px; border-radius: 10px; background: #fff; border: 1px solid #eee; overflow: hidden; }
        #audio-visualizer { width: 100%; height: 100%; }

        /* ================= 右側區域 (重點修改) ================= */
        .right-column {
            display: flex; flex-direction: column; gap: 20px; height: 100%;
        }

        /* 1. 情緒感知 */
        .emotion-section {
            background: #fff; border-radius: 16px; padding: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.05);
        }
        .progress-row { display: flex; align-items: center; margin-bottom: 15px; }
        .progress-label { width: 50px; font-weight: bold; color: #666; font-size: 1rem; }
        .progress-track { flex: 1; height: 12px; background-color: #f0f2f5; border-radius: 10px; overflow: hidden; margin: 0 15px; }
        .progress-bar { height: 100%; width: 0%; border-radius: 10px; transition: width 0.5s; }
        .bar-text { background: linear-gradient(90deg, #f6d365, #fda085); } 
        .bar-audio { background: linear-gradient(90deg, #84fab0, #8fd3f4); }
        .bar-face { background: linear-gradient(90deg, #ff9a9e, #fecfef); }
        .progress-info { width: 140px; display: flex; justify-content: flex-end; align-items: center; gap: 10px; }
        .emotion-name { font-size: 0.9em; font-weight: 600; color: #666; text-transform: uppercase; }
        .emotion-percent { font-size: 1.1em; font-weight: 800; color: #333; min-width: 45px; text-align: right; }

        /* 2. 決策計算 (加大、排版) */
        .calc-wrapper { flex-shrink: 0; }
        .decision-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .personality-tag { background: #f8f9fa; padding: 6px 15px; border-radius: 20px; font-size: 0.9em; color: #555; border: 1px solid #eee; }
        #personality-display { color: #6f42c1; font-weight: 800; font-size: 1.2em; margin-left: 8px; }

        .calc-section {
            background-color: #282c34; color: #98c379;
            border-radius: 12px; padding: 20px; /* 增加內距 */
            font-family: 'Consolas', monospace; 
            font-size: 0.95em; /* 字體加大 */
            line-height: 1.6;  /* 行距拉開 */
            height: 160px;     /* 高度加大 */
            overflow-y: auto;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.2);
            border: 1px solid #3e4451;
        }
        /* 讓計算過程的關鍵字更明顯 */
        .calc-highlight { color: #e06c75; font-weight: bold; }

        /* 3. AI 舞台 (佈局重構) */
        .avatar-section {
            flex: 1; /* 佔據剩餘空間 */
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.08); 
            display: flex; /* 改用 Flex */
            flex-direction: row; /* 左右排列 */
            align-items: flex-end; /* 底部對齊 */
            justify-content: space-between;
            padding: 20px;
            overflow: hidden;
            position: relative;
        }
        
        /* 左邊：對話區 (機器人左邊) */
        .stage-dialogue-area {
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 對話在底部 */
            align-items: flex-end; /* 靠右對齊 (靠近機器人) */
            padding-right: 20px;
            padding-bottom: 20px;
            gap: 15px;
        }

        /* 右邊：機器人 (固定在右下) */
        .stage-avatar-area {
            width: 35%; /* 機器人佔寬度 */
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
        }

        #assistant-avatar {
            max-width: 100%; max-height: 100%; object-fit: contain;
            transition: transform 0.2s; filter: drop-shadow(0 15px 30px rgba(0,0,0,0.15));
        }
        .speaking { animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { from { transform: scale(1); } to { transform: scale(1.05); } }

        /* 氣泡樣式 */
        .bubble-base {
            padding: 15px 25px; border-radius: 20px; max-width: 90%; 
            opacity: 0; transform: translateY(20px); transition: all 0.4s ease;
        }
        .bubble-base.show { opacity: 1; transform: translateY(0); }

        /* User 氣泡 (上方，縮小，半透明) */
        .user-bubble-mirror {
            background: #f1f3f5; color: #666;
            font-size: 1rem; border-bottom-right-radius: 5px;
            margin-right: 10px; /* 稍微錯開 */
        }

        /* Robot 氣泡 (下方，大，清晰) */
        .ai-bubble-mirror {
            background: rgba(255,255,255,0.95);
            border: 2px solid #007bff;
            color: #333; font-weight: bold; font-size: 1.4rem;
            border-bottom-right-radius: 0; /* 指向右邊機器人 */
            box-shadow: 0 10px 25px rgba(0,123,255,0.15);
        }

        /* 隱藏區 */
        .logic-holder { position: absolute; opacity: 0; pointer-events: none; height: 0; width: 0; }
        #current-dialogue-area { opacity: 0; height: 0; position: absolute; }
        .hidden-data { display: none; }

    </style>
</head>
<body>

    <div class="connection-bar">
        <span>⚙️ 連線設定: </span>
        <input type="text" id="tunnel-url" placeholder="請貼上 Cloudflare Tunnel 網址...">
        <button onclick="manualConnect()">確認連線</button>
    </div>

    <div class="main-container">
        
        <div class="left-column">
            <div class="video-container-wrapper">
                <h3>語音輸入</h3>
                <div class="video-box">
                    <div id="camera-preview">
                        <video id="video-stream" autoplay muted></video>
                    </div>
                    <button id="record-button" class="btn-idle" onclick="toggleRecording()" disabled>
                        <span id="record-text">等待連線...</span>
                    </button>
                </div>
            </div>

            <div class="text-container-wrapper">
                <h3>文字輸入</h3>
                <div class="text-input-box">
                    <div id="user-text-mirror">(等待對話...)</div>
                    <div class="visualizer-container">
                        <canvas id="audio-visualizer"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <div class="right-column">
            
            <div>
                <h3>多模態情緒感知</h3>
                <div class="emotion-section">
                    <div class="progress-row">
                        <div class="progress-label">文字</div>
                        <div class="progress-track"><div class="progress-bar bar-text" id="bar-text-visual"></div></div>
                        <div class="progress-info">
                            <span id="label-text-visual" class="emotion-name">--</span>
                            <span id="val-text-visual" class="emotion-percent">0%</span>
                        </div>
                    </div>
                    <div class="progress-row">
                        <div class="progress-label">語音</div>
                        <div class="progress-track"><div class="progress-bar bar-audio" id="bar-audio-visual"></div></div>
                        <div class="progress-info">
                            <span id="label-audio-visual" class="emotion-name">--</span>
                            <span id="val-audio-visual" class="emotion-percent">0%</span>
                        </div>
                    </div>
                    <div class="progress-row">
                        <div class="progress-label">臉部</div>
                        <div class="progress-track"><div class="progress-bar bar-face" id="bar-face-visual"></div></div>
                        <div class="progress-info">
                            <span id="label-face-visual" class="emotion-name">--</span>
                            <span id="val-face-visual" class="emotion-percent">0%</span>
                        </div>
                    </div>
                    <div class="hidden-data">
                        <span id="text-emotion-display">--</span>
                        <span id="audio-emotion-display">--</span>
                        <span id="facial-emotion-display">--</span>
                    </div>
                </div>
            </div>

            <div class="calc-wrapper">
                <div class="decision-header">
                    <h3>決策計算過程</h3>
                    <div class="personality-tag">
                        當前: <span id="personality-display">--</span> 
                        <span id="personality-mode-tag">(Auto)</span>
                    </div>
                </div>
                <div id="calc-display-area" class="calc-section">
                    > System initialized...<br>
                    > Waiting for input...
                </div>
            </div>

            <div class="avatar-section">
                <div class="stage-dialogue-area">
                    <div id="stage-user-bubble" class="bubble-base user-bubble-mirror">
                        ...
                    </div>
                    <div id="stage-ai-bubble" class="bubble-base ai-bubble-mirror">
                        (我是 AI 助理)
                    </div>
                </div>

                <div class="stage-avatar-area">
                    <img id="assistant-avatar" src="" alt="AI Avatar">
                </div>
            </div>
        </div>
    </div>

    <div class="logic-holder">
        <div id="current-dialogue-area"></div>
        <audio id="tts-audio"></audio>
    </div>

    <script>
        /* --- 核心運作邏輯 (不變) --- */
        const STATE = { IDLE: 'IDLE', RECORDING: 'RECORDING', PROCESSING: 'PROCESSING' };
        let currentState = STATE.IDLE;
        let mediaRecorder, audioStream, videoTrack, audioContext, analyserNode;
        let audioChunks = [], capturedImageBlobs = [], captureInterval;
        let CURRENT_BASE_URL = null;
        let ignoreClicksUntil = 0;

        const VOICE_THRESHOLD = 5;      
        const SILENCE_TIMEOUT = 2.5;     
        const FRAME_RATE = 0.5;

        async function manualConnect() {
            const url = document.getElementById('tunnel-url').value.trim();
            if(!url) return alert("請輸入網址");
            try {
                const testImg = new Image();
                testImg.src = `${url}/static/image/humorous.png`;
                testImg.onload = () => {
                    CURRENT_BASE_URL = url.endsWith('/') ? url.slice(0, -1) : url;
                    document.getElementById('record-button').disabled = false;
                    document.getElementById('record-text').textContent = "點擊開始對話";
                    loadAvatar('humorous'); 
                    initMedia();
                };
                testImg.onerror = () => alert("連線失敗");
            } catch(e) { alert("錯誤: " + e.message); }
        }

        async function initMedia() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: true });
                audioStream = stream;
                document.getElementById('video-stream').srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                setupAudioVisualizer(stream);
            } catch(e) { console.error(e); alert("無法取得權限"); }
        }

        function setupAudioVisualizer(stream) {
            if(!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const source = audioContext.createMediaStreamSource(stream);
            analyserNode = audioContext.createAnalyser();
            analyserNode.fftSize = 512;
            source.connect(analyserNode);
            drawVisualizer();
        }

        function drawVisualizer() {
            const canvas = document.getElementById('audio-visualizer');
            const ctx = canvas.getContext('2d');
            const container = canvas.parentElement;
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            const bufferLength = analyserNode.frequencyBinCount;
            const dataArray = new Uint8Array(bufferLength);
            const draw = () => {
                requestAnimationFrame(draw);
                analyserNode.getByteFrequencyData(dataArray);
                ctx.fillStyle = '#fff';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                const barWidth = (canvas.width / bufferLength) * 2.5;
                let x = 0;
                for(let i = 0; i < bufferLength; i++) {
                    const barHeight = (dataArray[i] / 255) * canvas.height;
                    ctx.fillStyle = `rgb(74, 144, 226)`; 
                    ctx.fillRect(x, canvas.height - barHeight, barWidth, barHeight);
                    x += barWidth + 1;
                }
                let sum = 0; for(let i=0; i<bufferLength; i++) sum += dataArray[i];
                if(currentState === STATE.RECORDING && (sum/bufferLength) > VOICE_THRESHOLD) lastSpeechTime = Date.now();
            };
            draw();
        }

        let lastSpeechTime = 0;
        let silenceTimer = null;
        function toggleRecording() {
            if(Date.now() < ignoreClicksUntil) return;
            if(currentState === STATE.IDLE) startRecording();
            else if(currentState === STATE.RECORDING) stopRecording();
        }

        function updateBtnState(state) {
            currentState = state;
            const btn = document.getElementById('record-button');
            const txt = document.getElementById('record-text');
            if(state === STATE.IDLE) {
                btn.className = 'btn-idle'; txt.textContent = "點擊開始對話"; btn.disabled = false;
            } else if(state === STATE.RECORDING) {
                btn.className = 'btn-recording'; txt.textContent = "聆聽中..."; btn.disabled = false;
            } else if(state === STATE.PROCESSING) {
                btn.className = 'btn-processing'; txt.textContent = "AI 思考中..."; btn.disabled = true;
            }
        }

        function startRecording() {
            updateBtnState(STATE.RECORDING);
            audioChunks = []; capturedImageBlobs = [];
            mediaRecorder = new MediaRecorder(audioStream);
            mediaRecorder.ondataavailable = e => audioChunks.push(e.data);
            mediaRecorder.onstop = uploadData;
            mediaRecorder.start();
            captureInterval = setInterval(() => {
                if(!videoTrack) return;
                const cvs = document.createElement('canvas');
                cvs.width = 640; cvs.height = 480;
                cvs.getContext('2d').drawImage(document.getElementById('video-stream'), 0, 0);
                cvs.toBlob(b => capturedImageBlobs.push(b), 'image/jpeg', 0.8);
            }, 1000/FRAME_RATE);
            lastSpeechTime = Date.now();
            ignoreClicksUntil = Date.now() + 1000;
            silenceTimer = setInterval(() => {
                if(Date.now() - lastSpeechTime > SILENCE_TIMEOUT * 1000) {
                    if(Date.now() > ignoreClicksUntil) stopRecording(); 
                }
            }, 500);
        }

        function stopRecording() {
            if(currentState !== STATE.RECORDING) return;
            clearInterval(captureInterval); clearInterval(silenceTimer);
            mediaRecorder.stop();
            updateBtnState(STATE.PROCESSING);
        }

        async function uploadData() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
            if(audioBlob.size < 1000) { updateBtnState(STATE.IDLE); return; }
            const fd = new FormData();
            fd.append('audio_file', audioBlob);
            capturedImageBlobs.forEach((b, i) => fd.append(`image_${i}`, b, `frame_${i}.jpg`));
            fd.append('turn_data', JSON.stringify({ session_id: 'demo_01', history: [] }));
            try {
                const res = await fetch(`${CURRENT_BASE_URL}/api/v1/process`, { method: 'POST', body: fd });
                handleResult(await res.json());
            } catch(e) { alert("上傳失敗"); updateBtnState(STATE.IDLE); }
        }

        function handleResult(data) {
            const chatArea = document.getElementById('current-dialogue-area');
            chatArea.innerHTML = `
                <div class="bubble user-bubble">${data.user_text || "..."}</div>
                <div class="bubble bot-bubble">${data.reply || "..."}</div>
            `;
            
            const mapE = { "comforting": "🤗 安撫", "cheerful": "😄 開朗", "humorous": "😆 幽默", "gentle": "💝 溫柔", "rational": "🤔 理性", "encouraging": "💪 鼓勵" };
            const pName = mapE[data.personality] || data.personality;
            document.getElementById('personality-display').textContent = pName;
            document.getElementById('personality-mode-tag').textContent = data.new_manual_personality ? "(手動)" : "(自動)";

            if(data.emotion_results) {
                if(data.emotion_results.text) document.getElementById('text-emotion-display').textContent = `${data.emotion_results.text.emotion} ${(data.emotion_results.text.score*100).toFixed(0)}%`;
                if(data.emotion_results.audio) document.getElementById('audio-emotion-display').textContent = `${data.emotion_results.audio.emotion} ${(data.emotion_results.audio.score*100).toFixed(0)}%`;
                if(data.emotion_results.facial) document.getElementById('facial-emotion-display').textContent = `${data.emotion_results.facial.emotion} ${(data.emotion_results.facial.confidence*100).toFixed(0)}%`;
            }

            if(data.calculation_logs) {
                document.getElementById('calc-display-area').textContent = data.calculation_logs.join('\n');
            }

            loadAvatar(data.personality);
            if(data.tts_audio_file) playAudio(data.tts_audio_file);
            else updateBtnState(STATE.IDLE);
        }

        function loadAvatar(personality) {
            document.getElementById('assistant-avatar').src = `${CURRENT_BASE_URL}/static/image/${personality || 'humorous'}.png`;
        }

        function playAudio(filename) {
            const audio = document.getElementById('tts-audio');
            const avatar = document.getElementById('assistant-avatar');
            audio.src = `${CURRENT_BASE_URL}/api/v1/audio-download?filename=${filename}`;
            audio.onplay = () => avatar.classList.add('speaking');
            audio.onended = () => { avatar.classList.remove('speaking'); updateBtnState(STATE.IDLE); };
            audio.onerror = () => { avatar.classList.remove('speaking'); updateBtnState(STATE.IDLE); };
            audio.play();
        }
    </script>

    <script>
        const dialogueObserver = new MutationObserver((mutations) => {
            const source = document.getElementById('current-dialogue-area');
            const userBubble = source.querySelector('.user-bubble');
            const botBubble = source.querySelector('.bot-bubble');
            
            // 1. 同步左側文字區
            const userMirror = document.getElementById('user-text-mirror');
            if(userBubble) userMirror.textContent = userBubble.textContent;

            // 2. 同步右側舞台對話
            const stageUserBubble = document.getElementById('stage-user-bubble');
            const stageAiBubble = document.getElementById('stage-ai-bubble');

            if(userBubble) {
                stageUserBubble.textContent = userBubble.textContent;
                stageUserBubble.classList.add('show');
            }
            if(botBubble) {
                stageAiBubble.textContent = botBubble.textContent;
                stageAiBubble.classList.add('show');
            }
        });
        dialogueObserver.observe(document.getElementById('current-dialogue-area'), { childList: true, subtree: true });

        function syncProgressBar(sourceId, barId, labelId, valId) {
            const source = document.getElementById(sourceId);
            const observer = new MutationObserver(() => {
                const fullText = source.textContent; 
                const match = fullText.match(/^([a-zA-Z]+)\s+(\d+)%$/);
                
                if (match) {
                    const emotionName = match[1];
                    const percent = match[2];
                    
                    document.getElementById(barId).style.width = percent + "%";
                    document.getElementById(labelId).textContent = emotionName;
                    document.getElementById(valId).textContent = percent + "%";
                } else if (fullText.trim() === "--") {
                     document.getElementById(labelId).textContent = "--";
                     document.getElementById(valId).textContent = "0%";
                     document.getElementById(barId).style.width = "0%";
                }
            });
            observer.observe(source, { childList: true, characterData: true, subtree: true });
        }
        
        syncProgressBar('text-emotion-display', 'bar-text-visual', 'label-text-visual', 'val-text-visual');
        syncProgressBar('audio-emotion-display', 'bar-audio-visual', 'label-audio-visual', 'val-audio-visual');
        syncProgressBar('facial-emotion-display', 'bar-face-visual', 'label-face-visual', 'val-face-visual');
    </script>

</body>
</html>
