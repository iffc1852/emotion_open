<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 多模態情緒助理</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --accent-color: #50e3c2;
            --bg-color: #f0f2f5;
            --card-bg: #ffffff;
            --text-color: #2c3e50;
            --bubble-user: #0084ff;
            --bubble-ai: #e4e6eb;
        }

        body { 
            font-family: 'Microsoft JhengHei', 'Segoe UI', Roboto, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background-color: var(--bg-color); 
            color: var(--text-color);
            height: 100vh;
            box-sizing: border-box;
            overflow: hidden; /* 防止雙卷軸 */
        }

        /* 主容器 */
        .container { 
            display: flex; 
            width: 100%; 
            height: 95vh; 
            background-color: var(--card-bg); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15); 
            border-radius: 20px; 
            overflow: hidden;
        }

        /* === 左側面板：控制與數據 === */
        .left-panel { 
            flex: 1; 
            padding: 30px; 
            background-color: #ffffff; 
            overflow-y: auto; /* 內容多時可捲動 */
            border-right: 1px solid #e0e0e0;
        }

        /* 標題 */
        h1 { font-size: 1.8em; color: var(--primary-color); margin-bottom: 20px; border-bottom: 3px solid var(--accent-color); display: inline-block; padding-bottom: 5px; }
        h2 { font-size: 1.4em; color: #444; margin-top: 25px; margin-bottom: 10px; display: flex; align-items: center; gap: 10px;}

        /* 輸入區塊美化 */
        .input-group { margin-bottom: 20px; background: #f8f9fa; padding: 15px; border-radius: 12px; border: 1px solid #eee; }
        .input-group label { font-size: 1.1em; color: #555; margin-bottom: 8px; font-weight: bold; }
        .url-container { display: flex; gap: 10px; }
        input[type="text"], select { 
            width: 100%; padding: 12px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; transition: 0.3s; 
        }
        input[type="text"]:focus, select:focus { border-color: var(--primary-color); outline: none; }
        
        button { font-size: 1.1em; padding: 10px 20px; border-radius: 8px; cursor: pointer; border: none; transition: transform 0.1s, box-shadow 0.2s; }
        button:active { transform: scale(0.98); }
        #connect-btn { background-color: var(--primary-color); color: white; font-weight: bold; }
        
        /* 錄音按鈕大改造 */
        .record-control { background: #fff; text-align: center; margin-bottom: 20px; padding: 15px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        #record-button { 
            width: 100%; padding: 15px; font-size: 1.3em; font-weight: bold; 
            background: linear-gradient(135deg, #ff6b6b, #ee5253); 
            color: white; border-radius: 50px; box-shadow: 0 4px 10px rgba(238, 82, 83, 0.4);
        }
        #record-button:hover:not(:disabled) { filter: brightness(1.1); }
        #record-button.recording { background: linear-gradient(135deg, #1dd1a1, #10ac84); box-shadow: 0 4px 10px rgba(16, 172, 132, 0.4); }
        #record-button:disabled { background: #ccc; cursor: not-allowed; box-shadow: none; }

        /* 視訊預覽 */
        #camera-preview { 
            position: relative; width: 100%; height: 250px; 
            background-color: #000; margin-top: 15px; border-radius: 12px; overflow: hidden; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        #camera-preview video { width: 100%; height: 100%; object-fit: cover; }
        
        /* 數據顯示卡片 */
        .data-card {
            background: white; border: 1px solid #e1e4e8; border-radius: 12px; padding: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03); margin-bottom: 15px;
        }

        /* 計算過程 (黑色終端機風格) */
        .calc-box { 
            background-color: #1e1e1e; color: #a8ff78; 
            padding: 15px; border-radius: 10px; font-family: 'Consolas', monospace; 
            font-size: 1em; line-height: 1.5;
            max-height: 120px; overflow-y: auto; 
            border-left: 5px solid var(--accent-color);
        }

        /* === 右側面板：機器人與對話 === */
        .right-panel { 
            flex: 1; 
            background-color: #fafbfc; 
            display: flex; 
            flex-direction: column; 
            padding: 0;
            position: relative;
        }

        /* 機器人顯示區 */
        .avatar-section {
            flex: 1; /* 佔據上半部 */
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 圖片靠下 */
            background: radial-gradient(circle at center, #ffffff 0%, #f0f2f5 100%);
            padding: 20px;
            overflow: hidden;
            min-height: 40%;
        }
        #assistant-avatar {
            max-height: 100%; /* 讓機器人盡可能大 */
            max-width: 90%;
            object-fit: contain;
            filter: drop-shadow(0 10px 20px rgba(0,0,0,0.15));
            transition: transform 0.3s ease, opacity 0.5s;
        }
        
        /* 對話區塊 (聊天室風格) */
        .chat-section {
            flex: 1; /* 佔據下半部 */
            background-color: white;
            border-top: 2px solid #eee;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: flex-end; /* 對話從底部開始 */
            gap: 15px;
            overflow-y: auto;
        }

        .chat-label { font-size: 0.9em; color: #888; margin-bottom: 2px; padding: 0 10px; }
        
        /* 氣泡樣式 */
        .bubble {
            max-width: 80%;
            padding: 15px 20px;
            border-radius: 20px;
            font-size: 1.2em;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bubble.user {
            align-self: flex-end; /* 靠右 */
            background-color: var(--bubble-user);
            color: white;
            border-bottom-right-radius: 5px;
        }

        .bubble.ai {
            align-self: flex-start; /* 靠左 */
            background-color: var(--bubble-ai);
            color: black;
            border-bottom-left-radius: 5px;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.8) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        /* 隱藏元素 (邏輯需要但介面不顯示) */
        #log-display, #debug-link-container, .hidden { display: none !important; }

        /* 狀態標籤美化 */
        .status-tag { padding: 5px 12px; border-radius: 20px; font-size: 1em; font-weight: bold; }
        .emotion-score { font-size: 1.1em; color: var(--primary-color); float: right;}
        
        /* 說話動畫 */
        @keyframes speak-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.03); } 100% { transform: scale(1); } }
        .speaking { animation: speak-pulse 0.5s infinite ease-in-out; }

    </style>
</head>
<body>
    <div class="container">
        <div class="left-panel">
            <h1>⚙️ 系統控制中心</h1>
            
            <div class="input-group">
                <label for="tunnel-url">🌐 連線網址 (HTTPS):</label>
                <div class="url-container">
                    <input type="text" id="tunnel-url" placeholder="https://xxx.trycloudflare.com">
                    <button id="connect-btn" onclick="manualConnect()">連線</button>
                </div>
            </div>

            <div class="record-control">
                <select id="mic-select" onchange="changeAudioInput()" style="margin-bottom:10px;">
                    <option value="" disabled selected>等待連線...</option>
                </select>
                <button id="record-button" onclick="toggleRecording()" disabled>
                    <span id="record-text">請先連線</span>
                </button>
                <div style="margin-top: 10px; font-weight: bold; color: #666;">
                    <span id="record-status">閒置中...</span> <span id="vol-display" style="font-size:0.8em; color:#999;"></span>
                </div>
                
                <div id="camera-preview">
                    <video id="video-stream" autoplay muted></video>
                    <canvas id="audio-visualizer" style="position:absolute; bottom:0; left:0; width:100%; height:60px;"></canvas>
                    <div id="duration-display" style="position:absolute; top:10px; right:15px; color:white; font-weight:bold; background:rgba(0,0,0,0.5); padding:2px 8px; border-radius:4px;">00:00</div>
                </div>
                <div id="debug-link-container"></div>
            </div>

            <h2>🧠 核心決策與權重</h2>
            <div id="calc-display" class="calc-box">等待數據運算...</div>

            <h2>📊 狀態監控</h2>
            <div class="data-card">
                <p><strong>當前人格:</strong> <span id="personality-display" style="color: #6f42c1; font-size: 1.4em; font-weight: bold;">--</span></p>
                <p><strong>人格模式:</strong> <span id="personality-mode-tag" class="status-tag auto" style="background:#e3f2fd; color:#1976d2;">Auto</span></p>
                <p><strong>記憶趨勢:</strong> <span id="emotion-trend-tag" class="status-tag improving" style="background:#e8f5e9; color:#2e7d32;">Stable</span></p>
            </div>

            <h2>🔬 多模態分析結果</h2>
            <div class="data-card">
                <div style="margin-bottom: 8px;">
                    <span>📝 文字情緒:</span> <span id="text-emotion" style="font-weight:bold;">--</span> 
                    <span id="text-score" class="emotion-score">0%</span>
                </div>
                <div style="margin-bottom: 8px;">
                    <span>🎤 語音情緒:</span> <span id="audio-emotion" style="font-weight:bold;">--</span> 
                    <span id="audio-score" class="emotion-score">0%</span>
                </div>
                <div>
                    <span>🎭 臉部情緒:</span> <span id="facial-emotion" style="font-weight:bold;">--</span> 
                    <span id="facial-score" class="emotion-score">0%</span>
                    <span id="facial-frames" style="font-size:0.8em; color:#999;">(0/0)</span>
                </div>
            </div>
            
            <div style="display:none;">
                <span id="user-text"></span>
                <span id="assistant-reply"></span>
            </div>
            <audio id="tts-audio" class="hidden"></audio>
        </div>
        
        <div class="right-panel">
            <div id="status-message" style="position: absolute; top: 10px; right: 20px; font-weight: bold; color: #ccc; z-index: 10;">等待指令...</div>
            
            <div class="avatar-section">
                <img id="assistant-avatar" src="" alt="AI Avatar" style="opacity: 0;">
            </div>

            <div class="chat-section">
                <div style="text-align: right;">
                    <div class="chat-label">User</div>
                    <div class="bubble user" id="bubble-user-text">請開始對話...</div>
                </div>
                <div style="text-align: left;">
                    <div class="chat-label">Assistant</div>
                    <div class="bubble ai" id="bubble-assistant-text">嗨！我是你的 AI 助理。</div>
                </div>
            </div>
            
            <div id="log-display"></div>
        </div>
    </div>

    <script>
        const STATE = { IDLE: 'IDLE', RECORDING: 'RECORDING', PROCESSING: 'PROCESSING' };
        let currentState = STATE.IDLE;
        const currentSessionId = Date.now().toString(); 

        let mediaRecorder, audioStream, videoTrack, audioContext, analyserNode, recordingStartTime, durationTimer, maxDurationTimeout;
        let audioChunks = [], capturedImageBlobs = [], captureInterval, ignoreClicksUntil = 0;

        const LOCK_SECONDS = 3; 
        const SILENCE_TIMEOUT_SECONDS = 3; 
        const MAX_RECORD_SECONDS = 15; 
        const NO_SPEECH_TIMEOUT = 5;
        
        const VOICE_THRESHOLD = 2;    
        const FRAME_RATE = 0.5; 
        const WAKE_WORD = "嗨小白"; 
        
        let CURRENT_BASE_URL = null;
        const API_PROCESS_PATH = "/api/v1/process"; 
        const API_DOWNLOAD_PATH = "/api/v1/audio-download";

        // ===== 1. 連線與裝置 =====
        function manualConnect() { checkUrlValidity(); }

        function checkUrlValidity() {
            const urlInput = document.getElementById('tunnel-url');
            const url = urlInput.value.trim();
            try {
                const urlObj = new URL(url);
                if (urlObj.protocol === 'https:' && url.includes('trycloudflare.com')) {
                    CURRENT_BASE_URL = url.endsWith('/') ? url.slice(0, -1) : url;
                    urlInput.style.borderColor = '#28a745';
                    appendLog(`✅ 網址有效。請求權限...`);
                    // 請求權限後列出裝置
                    navigator.mediaDevices.getUserMedia({ audio: true, video: true })
                        .then(s => { s.getTracks().forEach(t => t.stop()); getAudioDevices(); })
                        .catch(e => appendLog(`❌ 需權限: ${e.message}`, 'error'));
                    
                    // 嘗試載入預設圖片測試連線
                    loadRemoteImage('humorous');
                    document.getElementById('status-message').textContent = "系統連線就緒";
                    return true;
                } else throw new Error();
            } catch (e) {
                CURRENT_BASE_URL = null;
                document.getElementById('record-button').disabled = true;
                urlInput.style.borderColor = '#dc3545';
                appendLog(`❌ 網址無效`, 'error');
                return false;
            }
        }

        async function getAudioDevices() {
            const select = document.getElementById('mic-select');
            select.innerHTML = '<option value="" disabled>正在掃描裝置...</option>';
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                const audioInputs = devices.filter(device => device.kind === 'audioinput');
                select.innerHTML = ''; 
                if (audioInputs.length === 0) {
                    const option = document.createElement('option'); option.text = "未偵測到麥克風"; select.add(option); return;
                }
                audioInputs.forEach(device => {
                    const option = document.createElement('option');
                    option.value = device.deviceId;
                    option.text = device.label || `麥克風 ${select.length + 1}`;
                    select.add(option);
                });
                if (audioInputs.length > 0) {
                    select.value = audioInputs[0].deviceId;
                    initMediaDevices(audioInputs[0].deviceId);
                }
            } catch (e) {
                appendLog(`⚠️ 無法列舉裝置: ${e.message}`, 'error');
            }
        }

        async function changeAudioInput() {
            const deviceId = document.getElementById('mic-select').value;
            if (deviceId) {
                await initMediaDevices(deviceId);
            }
        }

        async function initMediaDevices(deviceId = null) {
            if (audioStream) audioStream.getTracks().forEach(track => track.stop());
            const constraints = {
                audio: { deviceId: deviceId ? { exact: deviceId } : undefined, echoCancellation: false, noiseSuppression: false, autoGainControl: false },
                video: { width: 640, height: 480 }
            };
            try {
                const stream = await navigator.mediaDevices.getUserMedia(constraints);
                audioStream = stream;
                document.getElementById('video-stream').srcObject = stream;
                videoTrack = stream.getVideoTracks()[0];
                document.getElementById('record-button').disabled = false;
                document.getElementById('record-text').textContent = '點擊說話 (VAD)';
                document.getElementById('record-button').style.background = "linear-gradient(135deg, #0984e3, #74b9ff)"; // 藍色待機
            } catch (err) {
                appendLog(`❌ 媒體失敗: ${err.message}`, 'error');
            }
        }

        function loadRemoteImage(personalityKey = 'humorous') {
            if (!CURRENT_BASE_URL) return;
            const avatar = document.getElementById('assistant-avatar');
            const newSrc = `${CURRENT_BASE_URL}/static/image/${personalityKey}.png`; 
            if (!avatar.src.includes(newSrc)) {
                avatar.style.opacity = 0;
                setTimeout(() => {
                    avatar.src = newSrc;
                    avatar.onerror = function() { 
                        this.onerror = null; 
                        this.src = `${CURRENT_BASE_URL}/static/image/humorous.png`; 
                    };
                    avatar.onload = function() { avatar.style.opacity = 1; }
                }, 200);
            }
        }

        // ===== 2. 錄音控制 =====
        function toggleRecording() {
            if (!CURRENT_BASE_URL) { alert('請先連線'); return; }
            if (!audioStream) { alert('媒體未就緒'); return; }
            if (Date.now() < ignoreClicksUntil) return; 
            
            if (currentState === STATE.IDLE) {
                ignoreClicksUntil = Date.now() + (LOCK_SECONDS * 1000);
                startRecording();
            } else if (currentState === STATE.RECORDING) {
                stopRecording(false); 
            }
        }

        function updateState(newState) {
            currentState = newState;
            const button = document.getElementById('record-button');
            const recordText = document.getElementById('record-text');
            const recordStatus = document.getElementById('record-status');
            const statusMsg = document.getElementById('status-message');

            switch (newState) {
                case STATE.IDLE:
                    button.disabled = false; button.classList.remove('recording');
                    button.style.background = "linear-gradient(135deg, #0984e3, #74b9ff)";
                    recordText.textContent = '點擊開始錄音';
                    recordStatus.textContent = '閒置中...';
                    statusMsg.textContent = '待命中';
                    document.getElementById('duration-display').textContent = '00:00'; 
                    document.getElementById('vol-display').textContent = '';
                    clearInterval(durationTimer); clearTimeout(maxDurationTimeout);
                    break;
                case STATE.RECORDING:
                    button.classList.add('recording');
                    button.style.background = "linear-gradient(135deg, #d63031, #ff7675)"; // 紅色錄音
                    let countdown = LOCK_SECONDS;
                    recordText.textContent = `鎖定 ${countdown}s`;
                    button.disabled = true; 
                    const lockTimer = setInterval(() => {
                        countdown--;
                        if (countdown > 0) recordText.textContent = `鎖定 ${countdown}s`;
                        else {
                            clearInterval(lockTimer);
                            if (currentState === STATE.RECORDING) {
                                button.disabled = false; 
                                recordText.textContent = '停止錄音';
                            }
                        }
                    }, 1000);
                    recordStatus.textContent = '聆聽中 (說話...)';
                    statusMsg.textContent = '正在聆聽...';
                    recordingStartTime = Date.now();
                    durationTimer = setInterval(updateDuration, 1000);
                    maxDurationTimeout = setTimeout(() => {
                        if (currentState === STATE.RECORDING) stopRecording(false);
                    }, MAX_RECORD_SECONDS * 1000);
                    break;
                case STATE.PROCESSING:
                    button.disabled = true;
                    button.style.background = "#b2bec3";
                    recordText.textContent = '思考中...';
                    recordStatus.textContent = 'AI 運算中...';
                    statusMsg.textContent = 'AI 思考中...';
                    clearInterval(durationTimer); clearTimeout(maxDurationTimeout);
                    break;
            }
        }

        async function startRecording() {
            if (currentState !== STATE.IDLE) return;
            updateState(STATE.RECORDING);
            audioChunks = []; capturedImageBlobs = [];
            try {
                mediaRecorder = new MediaRecorder(audioStream);
                mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
                mediaRecorder.onstop = uploadData; 
                mediaRecorder.start();
                startFaceCapture();
                setupAudioAnalysis(audioStream);
                detectSilence(); 
            } catch (e) {
                updateState(STATE.IDLE);
            }
        }

        function stopRecording(isSilentStop = true) {
            if (currentState !== STATE.RECORDING) return;
            stopFaceCapture();
            if (mediaRecorder && mediaRecorder.state === "recording") mediaRecorder.stop();
            const canvas = document.getElementById('audio-visualizer');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            updateState(STATE.PROCESSING); 
        }

        // ===== 3. VAD 邏輯 =====
        function setupAudioAnalysis(stream) {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            if (audioContext.state === 'suspended') audioContext.resume();
            const source = audioContext.createMediaStreamSource(stream);
            analyserNode = audioContext.createAnalyser(); 
            analyserNode.fftSize = 2048; 
            source.connect(analyserNode);
        }

        function visualizeAudio() {
            const canvas = document.getElementById('audio-visualizer');
            const ctx = canvas.getContext('2d');
            const WIDTH = canvas.width = canvas.clientWidth;
            const HEIGHT = canvas.height = canvas.clientHeight;
            if (!analyserNode) return;
            const bufferLength = analyserNode.fftSize;
            const dataArray = new Uint8Array(bufferLength);
            function draw() {
                if (currentState !== STATE.RECORDING) return;
                requestAnimationFrame(draw);
                analyserNode.getByteTimeDomainData(dataArray);
                ctx.clearRect(0, 0, WIDTH, HEIGHT);
                ctx.lineWidth = 2; ctx.strokeStyle = '#00b894'; ctx.beginPath(); // 綠色波形
                const sliceWidth = WIDTH * 1.0 / bufferLength;
                let x = 0;
                for(let i = 0; i < bufferLength; i++) {
                    const v = dataArray[i] / 128.0;
                    const y = v * HEIGHT/2;
                    if(i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
                    x += sliceWidth;
                }
                ctx.lineTo(WIDTH, HEIGHT/2);
                ctx.stroke();
            }
            draw();
        }

        function detectSilence() {
            if (!analyserNode) return;
            visualizeAudio(); 
            const bufferLength = analyserNode.fftSize;
            const buffer = new Uint8Array(bufferLength);
            let hasVoice = false;
            let lastActive = audioContext.currentTime;
            const detectionStartTime = audioContext.currentTime;
            let debugCounter = 0;
            
            function loop() {
                if (currentState !== STATE.RECORDING) return;
                analyserNode.getByteTimeDomainData(buffer);
                let max = 0;
                for (let i = 0; i < buffer.length; i++) max = Math.max(max, Math.abs(buffer[i] - 128)); 
                const now = audioContext.currentTime;
                
                // 更新音量顯示
                const volDisplay = document.getElementById('vol-display');
                if (debugCounter++ % 10 === 0) { 
                    volDisplay.textContent = `(音量: ${max})`;
                    volDisplay.style.color = max > VOICE_THRESHOLD ? '#00b894' : '#999';
                }
                
                if (max > VOICE_THRESHOLD) { 
                    hasVoice = true;
                    lastActive = now;
                }
                
                // VAD 超時
                if (hasVoice && (now - lastActive) >= SILENCE_TIMEOUT_SECONDS) {
                    if ((now - detectionStartTime) > LOCK_SECONDS) { 
                        stopRecording(true); return;
                    }
                }
                
                // 起始無聲超時
                if (!hasVoice && (now - detectionStartTime) > NO_SPEECH_TIMEOUT) {
                    stopRecording(false); return;
                }
                
                requestAnimationFrame(loop);
            }
            requestAnimationFrame(loop);
        }
        
        function updateDuration() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            document.getElementById('duration-display').textContent = 
                `${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
        }

        // ===== 4. 拍照與上傳 =====
        function startFaceCapture() {
            capturedImageBlobs = [];
            captureInterval = setInterval(() => {
                if (!videoTrack) return;
                const canvas = document.createElement('canvas');
                canvas.width = videoTrack.getSettings().width || 640;
                canvas.height = videoTrack.getSettings().height || 480;
                canvas.getContext('2d').drawImage(document.getElementById('video-stream'), 0, 0);
                canvas.toBlob(b => { if(b) capturedImageBlobs.push(b); }, 'image/jpeg', 0.8);
            }, 1000 / FRAME_RATE);
        }
        function stopFaceCapture() { clearInterval(captureInterval); }

        async function uploadData() {
            const audioBlob = new Blob(audioChunks, { type: 'audio/webm' }); 
            
            // 下載連結生成 (但隱藏)
            const audioUrl = URL.createObjectURL(audioBlob);
            const downloadLink = document.createElement('a');
            downloadLink.href = audioUrl; downloadLink.download = `debug_${Date.now()}.webm`;
            downloadLink.textContent = `下載錄音`;
            document.getElementById('debug-link-container').appendChild(downloadLink);

            if (audioBlob.size < 1000) {
                appendLog('⚠️ 錄音極短', 'warning');
                updateState(STATE.IDLE);
                return;
            }
            const formData = new FormData();
            formData.append('audio_file', audioBlob, `audio_${Date.now()}.webm`); 
            capturedImageBlobs.forEach((b, i) => formData.append(`image_${i}`, b, `frame_${i}.jpg`));
            formData.append('turn_data', JSON.stringify({ session_id: currentSessionId, history: [], wake_word: WAKE_WORD }));
            
            appendLog(`上傳中...`);
            try {
                const res = await fetch(CURRENT_BASE_URL + API_PROCESS_PATH, { method: 'POST', body: formData });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                handleAPIReply(await res.json());
            } catch (err) {
                appendLog(`上傳失敗`, 'error');
                updateState(STATE.IDLE);
                document.getElementById('status-message').textContent = '連線錯誤';
            }
        }

        // ===== 5. 回應處理與 UI =====
        async function handleAPIReply(result) {
            // 更新隱藏的 raw data
            document.getElementById('user-text').textContent = result.user_text;
            document.getElementById('assistant-reply').textContent = result.reply;

            // *** 關鍵修改：更新氣泡對話 ***
            document.getElementById('bubble-user-text').textContent = result.user_text;
            document.getElementById('bubble-assistant-text').textContent = result.reply;

            updateUIPanels(result);
            await playTTSAudio(result.tts_audio_file);
            updateState(STATE.IDLE);
        }

        async function playTTSAudio(filename) {
            if (!filename) return;
            const audio = document.getElementById('tts-audio');
            const avatar = document.getElementById('assistant-avatar');
            audio.src = CURRENT_BASE_URL + API_DOWNLOAD_PATH + `?filename=${filename}`;
            return new Promise(resolve => {
                audio.onplay = () => { avatar.classList.add('speaking'); document.getElementById('status-message').textContent = '回應中...'; };
                const finish = () => { avatar.classList.remove('speaking'); document.getElementById('status-message').textContent = '待命中'; resolve(); };
                audio.onended = finish; audio.onerror = finish;
                audio.play().catch(finish);
            });
        }

        function updateUIPanels(result) {
             const mapP = { "comforting": "安撫型", "cheerful": "開朗型", "humorous": "幽默型", "gentle": "溫柔型", "rational": "理性型", "encouraging": "鼓勵型", "empathetic": "共鳴型" };
             const mapE = { "comforting": "🤗", "cheerful": "😄", "humorous": "😆", "gentle": "💝", "rational": "🤔", "encouraging": "💪", "empathetic": "😌" };
             const pName = mapP[result.personality] || "未知";
             document.getElementById('personality-display').textContent = `${mapE[result.personality]||'❓'} ${pName}`;
             document.getElementById('personality-mode-tag').textContent = result.new_manual_personality ? '手動' : '自動';
             
             const trendTag = document.getElementById('emotion-trend-tag');
             trendTag.textContent = getTrendMessage(result.emotion_trend);
             // 樣式
             trendTag.style.background = '#e8f5e9'; trendTag.style.color = '#2e7d32'; 
             if (result.emotion_trend.includes('worsening')) { trendTag.style.background = '#ffebee'; trendTag.style.color = '#c62828'; }

             if (result.calculation_logs) {
                 document.getElementById('calc-display').textContent = result.calculation_logs.join('\n');
             }

             if(result.emotion_results?.text) {
                 const e = result.emotion_results.text;
                 document.getElementById('text-emotion').textContent = `${e.emotion}`;
                 document.getElementById('text-score').textContent = `${(e.score*100).toFixed(1)}%`;
             }
             if(result.emotion_results?.audio) {
                 const e = result.emotion_results.audio;
                 document.getElementById('audio-emotion').textContent = `${e.emotion}`;
                 document.getElementById('audio-score').textContent = `${(e.score*100).toFixed(1)}%`;
             }
             if(result.emotion_results?.facial) {
                 const e = result.emotion_results.facial;
                 document.getElementById('facial-emotion').textContent = `${e.emotion}`;
                 document.getElementById('facial-score').textContent = `${(e.confidence*100).toFixed(1)}%`;
                 document.getElementById('facial-frames').textContent = `(${e.num_valid_frames}/${e.num_total_frames})`;
             }
             loadRemoteImage(result.personality || 'humorous');
        }

        function getTrendMessage(trend) { 
            if (trend === 'worsening') return '惡化中 🔻';
            if (trend === 'improving') return '改善中 ⬆️';
            if (trend === 'persistent_worsening') return '持續惡化 🌧️';
            if (trend === 'persistent_improving') return '持續改善 🌟';
            return '穩定 (Stable) ⏸️';
        }
        function appendLog(msg, type='info') {
            const div = document.createElement('div');
            div.textContent = msg;
            document.getElementById('log-display').prepend(div);
        }

        document.addEventListener('DOMContentLoaded', () => {
             document.getElementById('record-button').addEventListener('click', toggleRecording);
             checkUrlValidity();
        });
    </script>
</body>
</html>
